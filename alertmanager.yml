# ============================================================
# Alertmanager 配置模板
#
# 说明：这里默认只配了一个 webhook 接收器，url 是占位地址。
# 请按实际渠道替换，或者在前面挂一个适配层：
#
#   - 钉钉：需要 prometheus-webhook-dingtalk 之类的适配器，
#           因为钉钉机器人只接受它自己的 JSON 格式。
#           填 http://<适配器>:8060/dingtalk/webhook1/send
#   - 企业微信：同样需要适配器把 Alertmanager 的 payload 转成
#           企业微信机器人的 markdown 格式。
#   - 邮件：直接改下面的 email_configs，需要 SMTP 账号信息。
#
# 渠道没配好之前，告警仍然会出现在 Prometheus 的 /alerts 页面上，
# 只是不会推送到外部。
# ============================================================
global:
  resolve_timeout: 5m

route:
  # 默认接收器
  receiver: 'default-webhook'
  # 按告警名和级别分组，避免同一故障刷屏
  group_by: ['alertname', 'severity']
  # 新告警先等 30 秒再发，便于同一批告警合并
  group_wait: 30s
  # 同组告警的发送间隔
  group_interval: 5m
  # 未恢复的告警重复提醒间隔
  repeat_interval: 4h

  routes:
    # 严重级别单独走一条，缩短重复间隔
    - matchers:
        - severity="critical"
      receiver: 'default-webhook'
      repeat_interval: 1h

inhibit_rules:
  # 服务已经挂掉时，抑制由它引发的错误率和延迟告警，避免告警风暴
  - source_matchers:
      - alertname="BackendDown"
    target_matchers:
      - severity=~"warning|critical"
    equal: ['instance']

receivers:
  - name: 'default-webhook'
    webhook_configs:
      # ⚠️ 换成你自己的告警接收地址
      - url: 'http://127.0.0.1:5000/webhook'
        send_resolved: true

  # ----------------------------------------------------------
  # 邮件示例（需要时把上面 route 的 receiver 改名为 'email'）
  # ----------------------------------------------------------
  # - name: 'email'
  #   email_configs:
  #     - to: 'ops@example.com'
  #       from: 'alertmanager@example.com'
  #       smarthost: 'smtp.example.com:587'
  #       auth_username: 'alertmanager@example.com'
  #       auth_password: '<SMTP 密码>'
  #       require_tls: true
