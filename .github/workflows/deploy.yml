name: Build and Push Docker Image

on:
  push:
    branches: [ "main", "master" ]
  # 在 PR 阶段就运行检查，避免有问题的代码合进 main 之后才发现
  pull_request:
  workflow_dispatch:

jobs:
  # ==========================================================
  # 1. 单元测试：不依赖任何外部中间件，几十秒内完成
  # ==========================================================
  unit-test:
    name: 单元测试
    runs-on: ubuntu-latest
    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置 Java 21 环境
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    # pom 中默认排除 @Tag("integration")，这里只会跑纯单元测试
    - name: 运行单元测试
      run: mvn -B test

  # ==========================================================
  # 2. 集成测试：需要 MySQL + Redis，单独一个 job
  # ==========================================================
  integration-test:
    name: 集成测试
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: lab_management_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置 Java 21 环境
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    # 使用 docker exec 在 MySQL 容器内执行 SQL 初始化，避免依赖宿主机的网络下载客户端
    - name: 初始化测试库
      run: |
        docker exec -i ${{ job.services.mysql.id }} mysql -uroot -proot lab_management_test < src/main/resources/db/migration/V1__init.sql
        docker exec -i ${{ job.services.mysql.id }} mysql -uroot -proot lab_management_test < src/main/resources/db/migration/V2__add_notice_read.sql
        docker exec -i ${{ job.services.mysql.id }} mysql -uroot -proot lab_management_test < src/main/resources/db/migration/V3__add_indexes.sql
        docker exec -i ${{ job.services.mysql.id }} mysql -uroot -proot lab_management_test < run_test_data.sql

    # -Pintegration 会把 surefire 的分组切换为 integration，只跑打了
    # @Tag("integration") 的用例（SecurityHardeningTest / LabsystemApplicationTests）
    - name: 运行集成测试
      run: mvn -B test -Pintegration
      env:
        DB_PASSWORD: root
        MINIO_ACCESS_KEY: testminio
        MINIO_SECRET_KEY: testminio

  # ==========================================================
  # 3. 构建并推送镜像（仅非 PR 事件）
  # ==========================================================
  build-and-push:
    name: 构建并推送镜像
    needs: [unit-test, integration-test]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
    - name: 1. 检出代码
      uses: actions/checkout@v4

    - name: 2. 设置 Java 21 环境
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    # 测试已在上游两个 job 中完成，这里只打包，避免重复执行
    - name: 3. 打包（跳过测试）
      run: mvn -B -DskipTests package

    - name: 4. 设置 Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: 5. 登录 Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: 6. 构建并推送 Docker 镜像
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        # 这里先推送，方便下一步直接扫描远端镜像
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/labsystem:latest
          ${{ secrets.DOCKER_USERNAME }}/labsystem:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: 7. 镜像安全扫描 (Trivy)
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        image-ref: ${{ secrets.DOCKER_USERNAME }}/labsystem:${{ github.sha }}
        format: 'table'
        # 发现 CRITICAL 或 HIGH 级别漏洞时，退出码设为 1，阻断流水线
        exit-code: '1'
        ignore-unfixed: true
        vuln-type: 'os,library'
        severity: 'CRITICAL,HIGH'