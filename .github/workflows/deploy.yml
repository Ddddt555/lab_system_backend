name: Build and Push Docker Image

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    # 🛑 只启动 MySQL 和 Redis 服务容器
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: lab_management_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
    - name: 1. 检出代码
      uses: actions/checkout@v4

    - name: 2. 设置 Java 21 环境
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: 3. 安装 MySQL 客户端并初始化测试库
      run: |
        sudo apt-get update && sudo apt-get install -y default-mysql-client
        mysql -h 127.0.0.1 -P 3306 -u root -proot lab_management_test < src/main/resources/db/migration/V1__init.sql
        mysql -h 127.0.0.1 -P 3306 -u root -proot lab_management_test < src/main/resources/db/migration/V2__init_data.sql
        mysql -h 127.0.0.1 -P 3306 -u root -proot lab_management_test < src/main/resources/db/migration/V3__add_notice_read.sql
        mysql -h 127.0.0.1 -P 3306 -u root -proot lab_management_test < run_test_data.sql

    - name: 4. 编译打包并运行测试 (质量门禁)
      run: mvn clean package
      env:
        DB_PASSWORD: root
        MINIO_ACCESS_KEY: testminio
        MINIO_SECRET_KEY: testminio

    - name: 5. 设置 Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: 6. 登录 Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: 7. 构建并推送 Docker 镜像
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        # 这里先推送，方便下一步直接扫描远端镜像
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/labsystem:latest
          ${{ secrets.DOCKER_USERNAME }}/labsystem:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    # 🛑【核心新增】Trivy 镜像漏洞扫描
    - name: 8. 镜像安全扫描 (Trivy)
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        image-ref: ${{ secrets.DOCKER_USERNAME }}/labsystem:${{ github.sha }}
        format: 'table'
        # 发现 CRITICAL 或 HIGH 级别漏洞时，退出码设为 1，阻断流水线
        exit-code: '1'
        ignore-unfixed: true
        vuln-type: 'os,library'
        severity: 'CRITICAL,HIGH'