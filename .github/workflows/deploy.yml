name: Build and Push Docker Image

on:
  push:
    branches: [ "main", "master" ] # 当推送到 main 或 master 分支时触发
  workflow_dispatch: # 允许你在 GitHub 页面上手动点击触发

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: 1. 检出代码
      uses: actions/checkout@v4

    - name: 2. 设置 Java 21 环境
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: 3. 编译打包 (跳过测试以加快构建)
      run: mvn clean package -DskipTests

    - name: 4. 设置 Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: 5. 登录 Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: 6. 构建并推送 Docker 镜像
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        # 🛑 注意：这里需要改成你自己的 Docker Hub 账号名/labsystem
        tags: ${{ secrets.DOCKER_USERNAME }}/labsystem:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max