# ============================================================
# 生产环境专属配置 (必须严格隔离)
# ============================================================
app:
  security:
    # 生产环境绝对禁止通过后门登录！
    test-login-enabled: false
  # 生产环境绝对禁止开启 cpolar 兼容
  cpolar-compatible: false

# 生产环境关闭 Knife4j 接口文档
knife4j:
  enable: false
  production: true

# 生产环境必须配置明确的跨域白名单（没有默认值，逼着必须配！）
cors:
  allowed-origins: ${CORS_ORIGINS}

# 生产环境数据库、Redis和密钥必须从环境变量读取，绝不回退到默认值
spring:
  datasource:
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000

  # 🛑【新增】生产环境强制要求提供 Redis 密码，如果环境变量缺失将无法启动
  data:
    redis:
      password: ${REDIS_PASSWORD}

  # 🛑【核心新增】生产环境 Flyway 策略收紧
  flyway:
    # 生产环境绝对禁止执行 clean 命令（防止误删全库）
    clean-disabled: true
    # 每次启动强制校验迁移脚本的 checksum，防止历史脚本被篡改
    validate-on-migrate: true
    # 生产环境禁止在已有非空数据库上强行 baseline，必须走正规迁移流程
    baseline-on-migrate: false

jwt:
  secret: ${JWT_SECRET}

# ============================================================
# 生产环境性能与安全调优
# ============================================================
# 1. 生产环境不打印 MyBatis 的 SQL，否则日志会爆炸且泄露隐私
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

# 2. 生产环境把日志级别调整为 info，不要用 debug
logging:
  level:
    root: info
    com.lab.labsystem: info

# ============================================================
# 生产环境安全加固：关闭监控端点敏感信息泄露，并开启探针
# ============================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true # 🛑【核心新增】开启探针
  health:
    livenessstate:
      enabled: true # 开启存活探针
    readinessstate:
      enabled: true # 开启就绪探针