# ============================================================
# 生产环境专属配置 (必须严格隔离)
# ============================================================
app:
  security:
    # 生产环境禁用测试登录接口
    test-login-enabled: false
  # 生产环境禁用 cpolar 内网穿透兼容模式
  cpolar-compatible: false
  admin:
    # 管理员首次启动时的初始密码（若不配置则随机生成并打印在日志）
    init-password: ${ADMIN_INIT_PASSWORD:}

# 生产环境关闭接口文档
knife4j:
  enable: false
  production: true

# 生产环境必须配置明确的跨域白名单（无默认值，必须显式配置）
cors:
  allowed-origins: ${CORS_ORIGINS}

# 生产环境数据库、Redis和密钥必须从环境变量读取，绝不回退到默认值
spring:
  datasource:
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000

  # 生产环境强制要求提供 Redis 密码，缺失则无法启动
  data:
    redis:
      password: ${REDIS_PASSWORD}

  # 生产环境 Flyway 策略收紧
  flyway:
    # 生产环境绝对禁止执行 clean 命令（防止误删全库）
    clean-disabled: true
    # 每次启动强制校验迁移脚本的 checksum，防止历史脚本被篡改
    validate-on-migrate: true
    # 生产环境禁止在已有非空数据库上强行 baseline，必须走正规迁移流程
    baseline-on-migrate: false

jwt:
  secret: ${JWT_SECRET}

# ============================================================
# 生产环境性能与安全调优
# ============================================================
# 1. 生产环境禁用 MyBatis SQL 日志，防止日志过多及隐私泄露
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

# 2. 生产环境日志级别调整为 info
logging:
  level:
    root: info
    com.lab.labsystem: info

# ============================================================
# 生产环境安全加固：关闭监控端点敏感信息泄露，并开启探针
# ============================================================
management:
  endpoints:
    web:
      exposure:
        # 暴露 prometheus 指标
        include: health,info,prometheus
  # 给所有监控指标打上应用名标签
  metrics:
    tags:
      application: labsystem
  endpoint:
    health:
      show-details: never
      probes:
        # 开启探针
        enabled: true
  health:
    # 开启存活探针
    livenessstate:
      enabled: true
    # 开启就绪探针
    readinessstate:
      enabled: true