server:
  port: 8080
  error:
    include-stacktrace: never
    include-message: never
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml
    min-response-size: 1024

spring:
  application:
    name: labsystem
  
  # 保持默认 dev
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/lab_management?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 2000ms

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

jwt:
  secret: ${JWT_SECRET}
  expire-hours: 24

cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# 本地路径配置（目前文件全走 MinIO，这里的配置作为历史遗留或本地备份兜底）
file:
  upload-dir: ${UPLOAD_DIR:./uploads/}

mybatis-plus:
  configuration:
    log-impl: ${MYBATIS_LOG_IMPL:org.apache.ibatis.logging.stdout.StdOutImpl}
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

knife4j:
  enable: true
  production: ${KNIFE4J_PRODUCTION:false}

minio:
  endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY}
  bucket-name: lab-files

app:
  security:
    test-login-enabled: ${TEST_LOGIN_ENABLED:true}

# ============================================================
# ⚠️ 监控与日志配置
# ============================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info # 仅暴露健康检查，防黑客探测其他端点
  endpoint:
    health:
      show-details: always

logging:
  file:
    name: ${LOG_PATH:./logs}/labsystem.log # 日志存放路径
  logback:
    rollingpolicy:
      max-history: 7 # 只保留 7 天日志，自动清理旧的
      max-file-size: 10MB # 单个文件超 10MB 自动切分
  level:
    root: info
    com.lab.labsystem: debug # 你的包名设为 debug