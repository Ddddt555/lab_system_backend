server:
  port: 8080
  error:
    include-stacktrace: never
    include-message: never
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml
    min-response-size: 1024

spring:
  application:
    name: labsystem
  
  # 运行环境配置，默认 dev
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/lab_management?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}

  # Flyway 数据库版本控制
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: false
    locations: classpath:db/migration

  # Redis 缓存配置
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 2000ms

  # 文件上传大小限制
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

# JWT 认证配置（双 Token 机制）
jwt:
  secret: ${JWT_SECRET}
  access-expire-minutes: 30
  refresh-expire-days: 7

# 跨域配置
cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# 本地文件存储目录
file:
  upload-dir: ${UPLOAD_DIR:./uploads/}

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    log-impl: ${MYBATIS_LOG_IMPL:org.apache.ibatis.logging.stdout.StdOutImpl}
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 接口文档配置
knife4j:
  enable: true
  production: ${KNIFE4J_PRODUCTION:false}

# MinIO 对象存储配置
minio:
  endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY}
  bucket-name: lab-files

# 自定义应用配置
app:
  security:
    test-login-enabled: ${TEST_LOGIN_ENABLED:false}
  # 是否开启 cpolar 内网穿透兼容模式
  cpolar-compatible: ${CPOLAR_COMPATIBLE:false}
  # 系统操作日志保留天数
  log:
    retention-days: ${LOG_RETENTION_DAYS:180}

# ============================================================
# 监控与日志配置
# ============================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: labsystem
    # 监控指标分布配置
    distribution:
      # 开启 HTTP 请求与自定义模块耗时的直方图统计，用于计算 P95/P99 延迟
      percentiles-histogram:
        http.server.requests: true
        api.module.duration: true
      # 配置延迟分桶（SLO），确保百分位数计算更精确
      slo:
        http.server.requests: 100ms,300ms,500ms,1s,3s
        api.module.duration: 50ms,100ms,300ms,500ms,1s,3s
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

logging:
  file:
    name: ${LOG_PATH:./logs}/labsystem.log
  logback:
    rollingpolicy:
      max-history: 7
      max-file-size: 10MB
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - [TraceId: %X{traceId:-N/A}] - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - [TraceId: %X{traceId:-N/A}] - %msg%n"
  level:
    root: info
    com.lab.labsystem: debug