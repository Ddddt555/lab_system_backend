# 专门为 Maven 打包测试准备的配置，不污染本地环境
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/lab_management?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    # 🛑 改为环境变量占位符
    password: ${DB_PASSWORD} 
  data:
    redis:
      host: localhost
      port: 6379

jwt:
  secret: TestSecretKeyForJwtTokenMustBeAtLeast32BytesLong!
  expire-hours: 24

minio:
  endpoint: http://127.0.0.1:9000
  # 🛑 改为环境变量占位符
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket-name: lab-files

app:
  security:
    test-login-enabled: true # 测试类需要这个后门来登录
  cpolar-compatible: false

cors:
  allowed-origins: http://localhost:5173