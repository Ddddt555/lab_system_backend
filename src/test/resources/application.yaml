# 专门为 Maven 打包测试准备的配置，不污染本地环境
# 🛑 安全基线：本文件不允许出现任何明文密码/密钥
# 本地运行测试前必须设置以下环境变量：
#   DB_PASSWORD        测试库密码
#   MINIO_ACCESS_KEY   MinIO 访问用户名
#   MINIO_SECRET_KEY   MinIO 访问密钥
# CI 环境通过 GitHub Secrets 注入，见 .github/workflows/ci.yml

spring:
  datasource:
    # 核心修复：测试库必须加 _test 后缀，严禁连主库
    url: jdbc:mysql://localhost:3306/lab_management_test?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_PASSWORD}
  
  # 🛑【新增】测试库已经通过 CI 脚本手动初始化，关闭 Flyway 防止重复建表报错
  flyway:
    enabled: false

  data:
    redis:
      host: localhost
      port: 6379

jwt:
  # 测试专用假密钥，不是生产密钥，可保留
  secret: TestSecretKeyForJwtTokenMustBeAtLeast32BytesLong!
  expire-hours: 24

minio:
  endpoint: http://127.0.0.1:9000
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket-name: lab-files

app:
  security:
    test-login-enabled: true # 测试类需要这个后门来登录
  cpolar-compatible: false

cors:
  allowed-origins: http://localhost:5173